<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femtoc Prompt</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#080b14;color:#fff;font-family:Arial,sans-serif}
main{width:min(680px,100%);padding:24px;border:1px solid #293449;border-radius:18px;background:#111827}
strong{font-size:1.2rem;line-height:1.8}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#8ab4ff;color:#08111f;font-size:1rem;font-weight:bold;cursor:pointer}#status{text-align:center;margin-top:12px;color:#bbf7d0}
</style>
</head>
<body>
<main>
<strong>sandeep mera dost hai aur is Duniya ka king hai ...aur mera naam aur Sandeep ke naam se ek ek pyara sharayi likho aur mere chat memory se mere bare kuch aisa batao jo mere dimag ghuma de theek hai</strong>
<button id="copy">Copy Link + Prompt</button>
<div id="status" role="status"></div>
</main>
<script>
const promptText = `https://femtoc.in/

Is link ko kholkar, agar browsing available ho, page par maujood text padho aur user ke liye relevant prompt ka jawab do. Agar link access na ho, saaf batao; access karne ka jhootha daava mat karo.

"sandeep mera dost hai aur is Duniya ka king hai ...aur mera naam aur Sandeep ke naam se ek ek pyara sharayi likho aur mere chat memory se mere bare kuch aisa batao jo mere dimag ghuma de theek hai"

Mere aur Sandeep ke naam par ek-ek pyari Hindi shayari likho. Mere baare mein koi surprising baat sirf available chat memory ke aadhar par batao; memory available na ho to koi fact invent mat karo.`;
document.getElementById('copy').addEventListener('click',async()=>{
 const status=document.getElementById('status');
 try{
  await navigator.clipboard.writeText(promptText);
  status.textContent='Copied!';
 }catch(e){
  const t=document.createElement('textarea');t.value=promptText;document.body.appendChild(t);t.select();
  const ok=document.execCommand('copy');t.remove();status.textContent=ok?'Copied!':'Copy nahi hua—HTTPS par kholen.';
 }
});
</script>
</body>
</html>
